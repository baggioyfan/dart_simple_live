name: apk-build

# 只打 APK 的独立流水线。
#
# 为什么单独一条：Linux / macOS 的包在 v1.12.0 就已经出好了，改一行 Android
# 相关的依赖没必要再把整条发布流程（macOS 两个架构 + Linux + Windows）跑一遍，
# 那里面 macOS 还要抢 runner，一次十几分钟。
#
# tag_name 留空 = 只上传 Artifact；填了 = 顺手把 APK 挂到那个 Release 上
# （tag 不存在时 action 会自动创建）。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "可选：填了就发 Release（如 v1.12.3）；留空只上传 Artifact"
        type: string
        required: false
        default: ""
      ref:
        description: "可选：要构建的分支/标签；留空 = 当前触发这次运行的分支"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apk-${{ inputs.ref || github.ref }}-${{ inputs.tag_name }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 填了 tag_name 就按它覆盖 pubspec 的 version，
      # 否则 APK 里显示的版本号还是仓库里的旧值。
      - name: Sync version from tag
        if: ${{ inputs.tag_name != '' }}
        uses: ./.github/actions/sync-version
        with:
          tag: ${{ inputs.tag_name }}

      #APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload APK to Release
        if: ${{ inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          files: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

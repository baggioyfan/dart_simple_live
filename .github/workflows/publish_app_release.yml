name: app-build-action
# 推送 Tag 时触发；也可以在 Actions 页面手动 Run workflow。
#
# 手动触发：
#   - 填 tag    → 照常构建并创建/更新该 tag 的 Release。
#                 tag 不存在时会在本次构建的 commit（master）上新建一个。
#   - 留空      → 只构建，产物只进 Artifacts，不碰 Release。
# 注意手动构建的代码固定取自 master，不是填的那个 tag（补发旧版本请走 push tag）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.12.1）。留空 = 只构建，不创建 Release"
        required: false
        default: ""

# Actions 列表里区分自动发版、手动发版和手动试构建
# push 时走第一个分支，后面的 inputs.tag 不会被求值（表达式短路）
run-name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag != '' && format('发布 {0}', inputs.tag) || '手动构建（仅 Artifacts）') }}

jobs:
  # Android 单独跑在 ubuntu 上。
  #
  # 原来它和 iOS 挤在同一个 macos-latest job 里，结果是 v1.12.0 那次 arm64
  # runner 抢不到、15 分钟窗口一过整条 job 被 cancelled，APK 明明一秒 macOS
  # 都不需要，却跟着一起丢了。拆开之后 APK 不再受 macOS 容量影响。
  build-android:
    runs-on: ubuntu-24.04
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 版本号统一从 tag 推导，别再靠手改 pubspec
      - name: Sync version from tag
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: ./.github/actions/sync-version
        with:
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      #APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      #设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      #打包APK
      #只出 arm64-v8a：armeabi-v7a 的机器跑直播基本带不动，x86_64 只对模拟器
      #有意义，多编两个 ABI 纯属浪费 runner 时间。--split-per-abi 保留是为了
      #产物文件名带架构后缀，用户下载时能一眼看出装哪个。
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      # 统一产物命名：simple_live_app-<版本>-android-arm64.apk
      #
      # Flutter 默认出的是 app-arm64-v8a-release.apk，既不带版本号，风格也和
      # macOS / Windows 的 simple_live_app-<版本>-xxx 对不上。发布页上三个平台
      # 排在一起时，用户很难一眼看出哪个是哪个版本，这里统一一次。
      # 版本只取 tag 的 1.12.12 部分，后面的 +11212 是 versionCode，不给人看。
      - name: Rename APK
        env:
          RAW_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          cd simple_live_app
          VER="${RAW_TAG#dev_v}"
          VER="${VER#v}"
          # 手动构建没填 tag 时没有版本可写，用 dev 顶上，别留个空档
          [ -n "$VER" ] || VER="dev"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/simple_live_app-${VER}-android-arm64.apk"
          ls -lh dist

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          # 产物名对不上就直接红，别静默产出一个空 artifact
          if-no-files-found: error
          path: |
            simple_live_app/dist/*.apk

  # iOS 构建暂时停用 —— 维护者没有 iOS 设备，产出的未签名 ipa 也没人装，
  # 却每次发版都要去抢一次 macOS runner（抢不到还会拖慢整条流水线）。
  # 需要恢复时把下面整块取消注释，并把 publish-mobile 的 needs 改回
  # [build-android, build-ios] 即可。
  #
  # build-ios:
  #   runs-on: macos-latest
  #   steps:
  #     #签出代码
  #     - uses: actions/checkout@v4
  #       with:
  #         ref: master
  #
  #     #设置Flutter
  #     - name: Flutter action
  #       uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: "3.38.x"
  #         cache: true
  #
  #     #更新Flutter的packages
  #     - name: Restore packages
  #       run: |
  #         cd simple_live_app
  #         flutter pub get
  #
  #     #打包iOS（未签名，靠 AltStore / Sideloadly 自签安装，7 天过期）
  #     - name: Build IPA
  #       run: |
  #         cd simple_live_app
  #         flutter build ios --release --no-codesign
  #
  #     #创建未签名ipa
  #     - name: Create IPA
  #       run: |
  #         cd simple_live_app
  #         mkdir build/ios/iphoneos/Payload
  #         cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
  #         cd build/ios/iphoneos/
  #         zip -q -r ios_no_sign.ipa Payload
  #         cd ../../..
  #
  #     #上传IPA至Artifacts
  #     - name: Upload IPA to Artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: mobile-ios
  #         path: |
  #           simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  # 汇总 Android（以及将来恢复后的 iOS）再发 Release。分两步而不是直接让
  # build-android 自己发，是为了留一个统一的出口：
  #   1. 多个 job 同时往同一个 release 传文件会打架；
  #   2. 用 !cancelled() 而不是默认的「needs 全成功」，某个平台挂了不影响别的。
  publish-mobile:
    needs: build-android
    # 手动触发没填 tag 就只留 Artifacts；填了 tag 就正常发版
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      #获取版本信息（push 取 tag 名，手动触发取输入框）
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #上传至Release
      - name: Upload Release
        # 两个 job 都挂了就没什么可发，跳过这一步，别让 action 去匹配空目录
        if: ${{ hashFiles('dist/*') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 tag 可能还不存在，action 会在当前 commit 上建一个
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: dist/*
      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # 打包 macOS：一个 universal 包（arm64 + x86_64）。
  #
  # 曾经按架构拆成两个 job 各自出单架构包（zip 20.4MB / 21.6MB），好处是
  # 每个用户只下自己那份，坏处是发布页两个文件得自己挑，还要占两次
  # macOS runner 配额。现在改回 universal：在 arm64 runner 上交叉编 x86_64，
  # 一次出包，体积约 42MB —— 两个 slice 的机器码不共享，只有资源去重。
  build-macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      # 版本号统一从 tag 推导，别再靠手改 pubspec
      - name: Sync version from tag
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: ./.github/actions/sync-version
        with:
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Show runner info
        run: |
          echo "target arch: arm64 + x86_64 (universal)"
          uname -m
          sw_vers
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # macos-15 / macos-15-intel 只有 Xcode 16.4（macOS 15.5 SDK），
        # connectivity_plus 7.1.0+ 的 NWPath.isUltraConstrained 编译不过：
        #   PathMonitorConnectivityProvider.swift:29:42: error: value of type
        #   'NWPath' has no member 'isUltraConstrained'
        # 用 pub 的局部覆盖降到 7.0.0（pubspec.yaml / pubspec.lock 不动）。
        run: |
          cd simple_live_app
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Force universal build settings
        # flutter_distributor 内部就是 `flutter build macos --release`，没有架构开关。
        # 追加到 Release.xcconfig 末尾（xcconfig 后写的覆盖前面 include 的值）：
        #   - ARCHS 钉死双架构，不依赖 ARCHS_STANDARD 在不同 Xcode 版本下的取值；
        #   - ONLY_ACTIVE_ARCH=NO 才是关键。runner 本身是 arm64，这一项若是 YES，
        #     只会编出 arm64，最后得到一个「看着像 universal 其实只有一份」的包。
        run: |
          cd simple_live_app
          printf '\n// CI: universal（arm64 + x86_64）\nARCHS = arm64 x86_64\nONLY_ACTIVE_ARCH = NO\n' \
            >> macos/Runner/Configs/Release.xcconfig
          cat macos/Runner/Configs/Release.xcconfig

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS (zip)
        # 只出 zip：dmg 需要额外装 appdmg，且和 zip 内容完全一致，
        # 维护者自己发版也只用 zip，省一步少一个依赖。
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets zip

      - name: Verify architecture
        # 必须硬失败：在 arm64 runner 上交叉编，最怕 ONLY_ACTIVE_ARCH 或某个 pod
        # 只出了单架构，产出一个「看着像 universal 其实只有 arm64」的包 ——
        # 在 Intel 机器上打开就是一句「应用已损坏」，用户根本不知道原因。
        # 第三方预编译产物（libmpv 等）缺 slice 的症状是运行到播放页才崩，
        # 构建期先抓出来更省事。
        run: |
          cd simple_live_app
          APP=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app，构建产物路径变了？"
            exit 1
          fi
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          echo "app: $APP"
          lipo -info "$BIN" || true

          # 新版 macOS 的 lipo 会把 arm64e 报成独立架构，比对前折叠回 arm64
          norm() {
            printf '%s\n' "$1" | tr ' ' '\n' \
              | sed -E 's/^arm64e(\.[A-Za-z0-9_]+)?$/arm64/' | tr '\n' ' ' \
              | sed -E 's/ +$//'
          }
          bad=0
          check() {
            local f="$1" got want
            case "$(file -b "$f" 2>/dev/null)" in
              *Mach-O*) ;;
              *) return 0 ;;
            esac
            got="$(norm "$(lipo -archs "$f" 2>/dev/null || true)")"
            for want in arm64 x86_64; do
              case " $got " in
                *" $want "*) ;;
                *)
                  echo "::error file=$f::架构为「${got:-未知}」，缺少 $want"
                  bad=1
                  ;;
              esac
            done
          }
          check "$BIN"
          # 只扫 MacOS 与 Frameworks：flutter_assets 里上万个资源不是 Mach-O
          for root in "$APP/Contents/MacOS" "$APP/Contents/Frameworks"; do
            [ -d "$root" ] || continue
            while IFS= read -r f; do check "$f"; done < <(find "$root" -type f)
          done
          [ "$bad" -eq 0 ] || { echo "::error::包内存在缺少 arm64 / x86_64 slice 的 Mach-O"; exit 1; }
          echo "包内全部 Mach-O 均为 universal"

      - name: Collect artifacts
        env:
          RAW_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          cd simple_live_app
          VER="${RAW_TAG#dev_v}"
          VER="${VER#v}"
          [ -n "$VER" ] || VER="dev"
          mkdir -p dist
          for f in build/dist/*/*.zip; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            # flutter_distributor 自己拼的名字是 simple_live_app-1.12.12+11212-macos.zip，
            # 那个 +11212 是 versionCode，给 Play 商店看的，不该出现在下载文件名里。
            # 这里重新拼一遍，版本号只留 1.12.12。
            cp "$f" "dist/simple_live_app-${VER}-macos-universal.${ext}"
          done
          ls -lh dist

      - name: Upload macOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          if-no-files-found: error
          retention-days: 14
          path: simple_live_app/dist/*

  # 单独一个 job 往 Release 传 macOS，和 publish-mobile 一样留个统一出口：
  # 多个 job 同时往同一个 release 传文件会打架，而 macOS 这里即使只有一个
  # 产物，分开发也和 Android / Windows 互不干扰。
  publish-macos:
    needs: build-macos
    # 默认行为是「needs 全部成功才跑」，改 !cancelled() 是为了让构建失败时
    # 已经产出的东西不至于全丢。手动触发没填 tag 时跳过，产物留在 Artifacts。
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          # 不加 pattern 会把 android / windows 的产物一起拖下来，
          # 然后一并塞进 release —— 既慢又可能和别的 job 抢同一个文件。
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload macOS to Release
        # 没编出产物就跳过，别让 action 去匹配空目录
        if: ${{ hashFiles('dist/*') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: dist/*

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 版本号统一从 tag 推导，别再靠手改 pubspec
      # windows runner 默认 pwsh，composite action 内部已显式用 bash
      - name: Sync version from tag
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: ./.github/actions/sync-version
        with:
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP
      # 只出 zip：msix 需要签名证书才能装，维护者发的也是免安装 zip
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets zip --skip-clean

      # 统一产物命名，规则和 Android / macOS 一致：
      # simple_live_app-<版本>-windows.zip（版本号不含 +11212 那种 versionCode）
      - name: Rename ZIP
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          cd simple_live_app
          VER="${RAW_TAG#dev_v}"
          VER="${VER#v}"
          [ -n "$VER" ] || VER="dev"
          mkdir -p dist
          for f in build/dist/*/*.zip; do
            [ -f "$f" ] || continue
            cp "$f" "dist/simple_live_app-${VER}-windows.zip"
          done
          ls -lh dist

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/dist/*.zip

      #获取版本信息（push 取 tag 名，手动触发取输入框）
      - name: Get version
        id: version
        shell: bash
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Echo version
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: echo "${{ steps.version.outputs.VERSION }}"

      #上传至Release
      - name: Upload Release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: |
            simple_live_app/dist/*.zip

      #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."

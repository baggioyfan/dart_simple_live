name: app-build-action
# 推送 Tag 时触发；也可以在 Actions 页面手动 Run workflow。
#
# 手动触发：
#   - 填 tag    → 照常构建并创建/更新该 tag 的 Release。
#                 tag 不存在时会在本次构建的 commit（master）上新建一个。
#   - 留空      → 只构建，产物只进 Artifacts，不碰 Release。
# 注意手动构建的代码固定取自 master，不是填的那个 tag（补发旧版本请走 push tag）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.12.1）。留空 = 只构建，不创建 Release"
        required: false
        default: ""

# Actions 列表里区分自动发版、手动发版和手动试构建
# push 时走第一个分支，后面的 inputs.tag 不会被求值（表达式短路）
run-name: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag != '' && format('发布 {0}', inputs.tag) || '手动构建（仅 Artifacts）') }}

jobs:
  # macOS 要按架构拆成两个 job，而 matrix 是静态的、job 级 if 又拿不到 matrix
  # 上下文，所以先用一个极轻的 job 把「这次编哪些架构」算成 JSON。
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve the macOS architecture matrix
        id: set
        run: |
          # 两个架构都出，各自独立包。arm64 → macos-15（Apple Silicon 原生），
          # x86_64 → macos-15-intel（GitHub 唯一的免费 x86_64 macOS runner）。
          arm64_leg='{"arch":"arm64","runner":"macos-15","artifact":"macos-arm64"}'
          x64_leg='{"arch":"x86_64","runner":"macos-15-intel","artifact":"macos-x86_64"}'
          printf 'matrix={"include":[%s,%s]}\n' "$arm64_leg" "$x64_leg" >> "$GITHUB_OUTPUT"
          printf '本次 macOS 构建：arm64 + x86_64\n' >> "$GITHUB_STEP_SUMMARY"

  # Android 单独跑在 ubuntu 上。
  #
  # 原来它和 iOS 挤在同一个 macos-latest job 里，结果是 v1.12.0 那次 arm64
  # runner 抢不到、15 分钟窗口一过整条 job 被 cancelled，APK 明明一秒 macOS
  # 都不需要，却跟着一起丢了。拆开之后 APK 不再受 macOS 容量影响。
  build-android:
    runs-on: ubuntu-24.04
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      #APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      #设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      #打包APK
      #只出 arm64-v8a：armeabi-v7a 的机器跑直播基本带不动，x86_64 只对模拟器
      #有意义，多编两个 ABI 纯属浪费 runner 时间。--split-per-abi 保留是为了
      #产物文件名带架构后缀，用户下载时能一眼看出装哪个。
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          # 产物名对不上就直接红，别静默产出一个空 artifact
          if-no-files-found: error
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # iOS 构建暂时停用 —— 维护者没有 iOS 设备，产出的未签名 ipa 也没人装，
  # 却每次发版都要去抢一次 macOS runner（抢不到还会拖慢整条流水线）。
  # 需要恢复时把下面整块取消注释，并把 publish-mobile 的 needs 改回
  # [build-android, build-ios] 即可。
  #
  # build-ios:
  #   runs-on: macos-latest
  #   steps:
  #     #签出代码
  #     - uses: actions/checkout@v4
  #       with:
  #         ref: master
  #
  #     #设置Flutter
  #     - name: Flutter action
  #       uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: "3.38.x"
  #         cache: true
  #
  #     #更新Flutter的packages
  #     - name: Restore packages
  #       run: |
  #         cd simple_live_app
  #         flutter pub get
  #
  #     #打包iOS（未签名，靠 AltStore / Sideloadly 自签安装，7 天过期）
  #     - name: Build IPA
  #       run: |
  #         cd simple_live_app
  #         flutter build ios --release --no-codesign
  #
  #     #创建未签名ipa
  #     - name: Create IPA
  #       run: |
  #         cd simple_live_app
  #         mkdir build/ios/iphoneos/Payload
  #         cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
  #         cd build/ios/iphoneos/
  #         zip -q -r ios_no_sign.ipa Payload
  #         cd ../../..
  #
  #     #上传IPA至Artifacts
  #     - name: Upload IPA to Artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: mobile-ios
  #         path: |
  #           simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  # 汇总 Android（以及将来恢复后的 iOS）再发 Release。分两步而不是直接让
  # build-android 自己发，是为了留一个统一的出口：
  #   1. 多个 job 同时往同一个 release 传文件会打架（matrix 里踩过这个坑）；
  #   2. 用 !cancelled() 而不是默认的「needs 全成功」，某个平台挂了不影响别的。
  publish-mobile:
    needs: build-android
    # 手动触发没填 tag 就只留 Artifacts；填了 tag 就正常发版
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      #获取版本信息（push 取 tag 名，手动触发取输入框）
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Echo version
        run: echo "${{ steps.version.outputs.VERSION }}"

      #上传至Release
      - name: Upload Release
        # 两个 job 都挂了就没什么可发，跳过这一步，别让 action 去匹配空目录
        if: ${{ hashFiles('dist/*') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 tag 可能还不存在，action 会在当前 commit 上建一个
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: dist/*
      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # 打包 macOS：按架构拆成两个 job，各自在原生 runner 上编，每个包只含单一架构。
  # 不拆的话 `flutter build macos` 会按 ARCHS_STANDARD 出 universal 包，
  # libmpv 的 arm64 + x86_64 两份 slice 都会链进去（zip 22MB → 42MB）。
  build-macos:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # 整 job 生效：macos/Podfile 的 post_install 读它，让 Pods 也只编目标架构。
      # pod install 可能在 pub get / build 任意一步被触发，放 job 级最稳。
      CI_MACOS_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Show runner info
        run: |
          echo "target arch: ${{ matrix.arch }}"
          uname -m
          sw_vers
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # macos-15 / macos-15-intel 只有 Xcode 16.4（macOS 15.5 SDK），
        # connectivity_plus 7.1.0+ 的 NWPath.isUltraConstrained 编译不过：
        #   PathMonitorConnectivityProvider.swift:29:42: error: value of type
        #   'NWPath' has no member 'isUltraConstrained'
        # 用 pub 的局部覆盖降到 7.0.0（pubspec.yaml / pubspec.lock 不动）。
        run: |
          cd simple_live_app
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
          echo "CI_MACOS_ARCH=$CI_MACOS_ARCH"

      - name: Force single-arch build settings
        # flutter_distributor 内部就是 `flutter build macos --release`，而它没有
        # 架构开关，只会按 ARCHS_STANDARD 出包。追加到 Release.xcconfig 末尾：
        # xcconfig 后写的覆盖前面 include 进来的值。
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          printf '\n// CI: 本次只出 %s\nARCHS = %s\n' "$ARCH" "$ARCH" \
            >> macos/Runner/Configs/Release.xcconfig
          cat macos/Runner/Configs/Release.xcconfig

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS (zip)
        # 只出 zip：dmg 需要额外装 appdmg，且和 zip 内容完全一致，
        # 维护者自己发版也只用 zip，省一步少一个依赖。
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets zip

      - name: Verify architecture
        # 必须硬失败：宿主与目标同架构时最容易静默出成 universal，那就等于白拆。
        # 第三方预编译产物（libmpv 等）缺 slice 的症状是运行到播放页才崩，
        # 构建期先抓出来更省事。
        env:
          WANT: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          APP=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app，构建产物路径变了？"
            exit 1
          fi
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          echo "app: $APP"
          lipo -info "$BIN" || true

          # 新版 macOS 的 lipo 会把 arm64e 报成独立架构，比对前折叠回 arm64
          norm() {
            printf '%s\n' "$1" | tr ' ' '\n' \
              | sed -E 's/^arm64e(\.[A-Za-z0-9_]+)?$/arm64/' | tr '\n' ' ' \
              | sed -E 's/ +$//'
          }
          bad=0
          check() {
            local f="$1" got
            case "$(file -b "$f" 2>/dev/null)" in
              *Mach-O*) ;;
              *) return 0 ;;
            esac
            got="$(norm "$(lipo -archs "$f" 2>/dev/null || true)")"
            case " $got " in
              *" $WANT "*) ;;
              *)
                echo "::error file=$f::架构为「${got:-未知}」，缺少 $WANT"
                bad=1
                ;;
            esac
          }
          check "$BIN"
          # 只扫 MacOS 与 Frameworks：flutter_assets 里上万个资源不是 Mach-O
          for root in "$APP/Contents/MacOS" "$APP/Contents/Frameworks"; do
            [ -d "$root" ] || continue
            while IFS= read -r f; do check "$f"; done < <(find "$root" -type f)
          done
          [ "$bad" -eq 0 ] || { echo "::error::包内存在缺少 $WANT slice 的 Mach-O"; exit 1; }
          echo "包内全部 Mach-O 均含 $WANT"

      - name: Collect artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          mkdir -p dist
          for f in build/dist/*/*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            stem="${base%.*}"
            ext="${base##*.}"
            # 两个架构的产物同名，必须带架构后缀，否则用户分不清
            cp "$f" "dist/${stem}-${ARCH}.${ext}"
          done
          ls -lh dist

      - name: Upload macOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: simple_live_app/dist/*

  # 单独一个 job 往 Release 传 macOS：matrix 两个 leg 同时创建同一个 release 会打架
  publish-macos:
    needs: build-macos
    # 默认行为是「needs 全部成功才跑」，于是 arm64 抢不到 runner 被取消时，
    # 已经编好的 x86_64 也跟着发不出去。改成 !cancelled() 让两个架构各自算数。
    # 手动触发没填 tag 时同样跳过，产物留在 Artifacts。
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          # 不加 pattern 会把 android / ios / linux / windows 的产物一起拖下来，
          # 然后一并塞进 release —— 既慢又可能和别的 job 抢同一个文件。
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload macOS to Release
        # 两个架构都没编出来就跳过，别让 action 去匹配空目录
        if: ${{ hashFiles('dist/*') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: dist/*

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP
      # 只出 zip：msix 需要签名证书才能装，维护者发的也是免安装 zip
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets zip --skip-clean

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.zip

      #获取版本信息（push 取 tag 名，手动触发取输入框）
      - name: Get version
        id: version
        shell: bash
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Echo version
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: echo "${{ steps.version.outputs.VERSION }}"

      #上传至Release
      - name: Upload Release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.VERSION }}"
          # 手动建 tag 时钉在本次构建的 commit 上，避免 master 又往前跑了导致 tag 偏移
          target_commitish: ${{ github.sha }}
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          # 不传 token：action 默认用 github.token，相关 job 都已声明 contents: write。
          files: |
            simple_live_app/build/dist/*/*.zip

      #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."

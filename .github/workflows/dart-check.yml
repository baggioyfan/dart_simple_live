name: dart-check

# 静态分析校验：只让真正的编译错误失败，lint 的 info/warning 不拦 CI
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      # 合进 master 也要跑一次：feat 分支上的检查只能证明「合并前是好的」，
      # 合并后的结果（尤其是解冲突时手工动过的地方）没人验证过。
      - "master"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 临时步骤：把解析出来的 pubspec.lock 打到日志里
      # 目的是在没有 Flutter 的机器上也能拿到这个文件（锁文件带内容哈希，手写不了）。
      # 取到并提交之后这一整段要删掉。
      - name: Dump pubspec.lock
        run: |
          cd simple_live_app
          echo "===LOCK_BEGIN==="
          base64 pubspec.lock
          echo "===LOCK_END==="

      - name: Analyze
        run: |
          cd simple_live_app
          flutter analyze --no-fatal-infos --no-fatal-warnings

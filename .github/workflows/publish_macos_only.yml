name: macos-build

# 只构建 macOS，手动触发。不依赖 dev 分支，不需要 Android/TV 签名 secrets。
#
# 架构拆分（做法与 fqapp 的 macos.yml 一致）：
#   arm64 与 x86_64 各跑一个 job，在各自的原生 runner 上构建，每个包只含单一架构。
#   这样 libmpv 只会链进目标 slice（universal 压缩 28.8MB → 单架构 ~14MB），
#   包体大约能砍一半。代价是 arm64 包不能跑在 Intel Mac 上，反之亦然。
#
# runner 对应关系：
#   arm64  → macos-15        （M1，GA，池子大，几乎不排队）
#   x86_64 → macos-15-intel  （GitHub 唯一的免费 x86_64 macOS runner）
#   macos-latest 现在指向 macOS 26 arm64，最新镜像容量最紧，实测排队 15 分钟后
#   被判 "not acquired by Runner" 直接取消；macos-14 系列已 deprecated；
#   macos-14-large（x64）是付费 larger runner。
#
# 最低系统由 macos/Podfile 与 Runner.xcodeproj 决定（当前 10.14），
# 与 runner 的操作系统版本无关。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构：both = 两个都出，各自独立包"
        type: choice
        required: false
        default: both
        options:
          - both
          - arm64
          - x86_64
      tag_name:
        description: "可选：填了就发 Release（如 v8.0.0）；留空只上传 Artifact"
        required: false
        default: ""
      ref:
        description: "可选：要构建的分支/标签；留空 = 当前触发这次运行的分支"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  # 目标架构要在 job 开始前定下来，而 matrix 是静态的，所以先用一个极轻的 job
  # 把「这次该编哪些架构」算成 JSON —— job 级 if 拿不到 matrix 上下文。
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve the architecture matrix
        id: set
        env:
          REQUESTED: ${{ inputs.arch }}
        run: |
          want="${REQUESTED:-both}"
          arm64_leg='{"arch":"arm64","runner":"macos-15","artifact":"macos-arm64"}'
          x64_leg='{"arch":"x86_64","runner":"macos-15-intel","artifact":"macos-x86_64"}'
          case "$want" in
            both)   legs="[$arm64_leg,$x64_leg]" ;;
            arm64)  legs="[$arm64_leg]" ;;
            x86_64) legs="[$x64_leg]" ;;
            *)
              echo "::error::arch 只能是 both / arm64 / x86_64（收到 '$want'）"
              exit 1
              ;;
          esac
          printf 'matrix={"include":%s}\n' "$legs" >> "$GITHUB_OUTPUT"
          printf '本次构建：%s\n' "$want" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # 整 job 生效：macos/Podfile 的 post_install 读它，让 Pods 也只编目标架构。
      # pod install 可能在 pub get / build 任意一步被触发，放 job 级最稳。
      CI_MACOS_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 原来写死 ref: master，导致在功能分支上手动触发也只会构建 master。
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Show runner info
        run: |
          echo "target arch: ${{ matrix.arch }}"
          echo "runner label: ${{ matrix.runner }}"
          uname -m
          sw_vers
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # macos-15 / macos-15-intel 只有 Xcode 16.4（macOS 15.5 SDK），
        # connectivity_plus 7.1.0+ 的 NWPath.isUltraConstrained 编译不过：
        #   PathMonitorConnectivityProvider.swift:29:42: error: value of type
        #   'NWPath' has no member 'isUltraConstrained'
        # 用 pub 的局部覆盖降到 7.0.0（pubspec.yaml / pubspec.lock 不动）。
        # 与 fqapp 的 macos.yml 同一套做法。
        run: |
          cd simple_live_app
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
          echo "CI_MACOS_ARCH=$CI_MACOS_ARCH"

      - name: Force single-arch build settings
        # flutter_distributor 内部就是 `flutter build macos --release`，而
        # `flutter build macos` 没有架构开关，只会按 ARCHS_STANDARD 出包
        # （macOS 上默认就是 universal，arm64 + x86_64 都链进去）。
        # 追加到 Release.xcconfig 末尾：xcconfig 后写的覆盖前面 include 里的值。
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          printf '\n// CI: 本次只出 %s\nARCHS = %s\n' "$ARCH" "$ARCH" \
            >> macos/Runner/Configs/Release.xcconfig
          cat macos/Runner/Configs/Release.xcconfig

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS (dmg + zip)
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip

      - name: Verify architecture
        # 必须硬失败：宿主与目标同架构时这里最容易静默出成 universal，
        # 那就等于白拆了一趟。第三方预编译产物（libmpv 等）缺 slice 的症状是
        # 运行到播放页才崩，构建期先抓出来更省事。
        env:
          WANT: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          APP=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app，构建产物路径变了？"
            exit 1
          fi
          echo "app: $APP"
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          echo "binary: $BIN"

          echo "--- 主可执行文件 ---"
          lipo -info "$BIN" || true
          file "$BIN" || true
          echo "--- 最低系统 ---"
          otool -l "$BIN" | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ {f=1}
                               f && /minos|version/ {print "  " $2; exit}' || true

          # 新版 macOS 的 lipo 会把 arm64e 报成独立架构，比对前折叠回 arm64
          norm() {
            printf '%s\n' "$1" | tr ' ' '\n' \
              | sed -E 's/^arm64e(\.[A-Za-z0-9_]+)?$/arm64/' | tr '\n' ' ' \
              | sed -E 's/ +$//'
          }
          bad=0
          check() {
            local f="$1" got
            case "$(file -b "$f" 2>/dev/null)" in
              *Mach-O*) ;;
              *) return 0 ;;
            esac
            got="$(norm "$(lipo -archs "$f" 2>/dev/null || true)")"
            case " $got " in
              *" $WANT "*) ;;
              *)
                echo "::error file=$f::架构为「${got:-未知}」，缺少 $WANT"
                bad=1
                ;;
            esac
          }
          check "$BIN"
          # 只扫 MacOS 与 Frameworks：flutter_assets 里上万个资源不是 Mach-O，
          # 对整个 .app 逐个 file 只是白等。
          for root in "$APP/Contents/MacOS" "$APP/Contents/Frameworks"; do
            [ -d "$root" ] || continue
            while IFS= read -r f; do check "$f"; done < <(find "$root" -type f)
          done
          [ "$bad" -eq 0 ] || { echo "::error::包内存在缺少 $WANT slice 的 Mach-O"; exit 1; }
          echo "包内全部 Mach-O 均含 $WANT"

          echo "--- Frameworks 架构（universal = 没切掉另一份）---"
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            [ -d "$fw" ] || continue
            n=$(basename "$fw" .framework)
            b="$fw/Versions/A/$n"
            [ -f "$b" ] || continue
            printf '  %-36s %s\n' "$n" "$(lipo -archs "$b" 2>/dev/null)"
          done

          echo "--- 包内体积（回答「为什么这么大」）---"
          du -sh "$APP" || true
          du -sh "$APP/Contents/"* 2>/dev/null | sort -hr || true

      - name: Collect artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd simple_live_app
          mkdir -p dist
          for f in build/dist/*/*.dmg build/dist/*/*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            stem="${base%.*}"
            ext="${base##*.}"
            # 两个架构的产物同名，必须带上架构后缀，否则用户分不清
            cp "$f" "dist/${stem}-${ARCH}.${ext}"
          done
          ls -lh dist

      - name: Upload macOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: simple_live_app/dist/*

  # 单独一个 job 发 Release：matrix 里两个 leg 同时创建同一个 release 会打架
  publish:
    needs: build-macos
    if: inputs.tag_name != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          # 不传 token 就用仓库自带的 GITHUB_TOKEN，这个仓库没有配 PAT
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          files: dist/*

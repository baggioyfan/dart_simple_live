name: macos-build

# 只构建 macOS，手动触发。
# 不依赖 dev 分支，不需要 Android/TV 签名 secrets；TOKEN 仅在填写 tag_name 发 Release 时需要。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "运行器：macos-latest/macos-15 为 arm64，macos-15-intel 为 x64（arm64 常因容量不足排队）"
        type: choice
        required: false
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
      tag_name:
        description: "可选：填了就发 Release（如 v8.0.0）；留空只上传 Artifact"
        required: false
        default: ""

jobs:
  build-macos:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Show runner info
        run: |
          echo "runner label: ${{ inputs.runner }}"
          uname -m
          sw_vers

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS (dmg + zip)
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip

      - name: List build output
        if: always()
        run: find simple_live_app/build/dist -type f 2>/dev/null || echo "no dist output"

      - name: Upload macOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: warn
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      - name: Upload Release
        if: inputs.tag_name != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

name: macos-build

# 只构建 macOS，手动触发。
# 不依赖 dev 分支，不需要 Android/TV 签名 secrets；TOKEN 仅在填写 tag_name 发 Release 时需要。
#
# runner 选择（与 fqapp 的 macos.yml 保持一致）：
#   macos-15       → macOS 15 arm64，标准 GA 镜像，容量充足，默认用它
#   macos-15-intel → macOS 15 x64，GitHub 唯一的免费 x86_64 macOS runner
#   macos-latest   → 现在指向 macOS 26 arm64，最新镜像容量最紧，容易排队 15 分钟
#                    后被判 "not acquired by Runner" 直接取消（实测踩过）
#   注意 macos-14 系列已 deprecated，macos-14-large（x64）还是付费 larger runner
#
# 产物最低系统由 macos/Podfile 与 Runner.xcodeproj 决定，当前是 10.14，
# 所以 x64 包在 macOS 14 的 Intel 机器上可直接运行。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "运行器：macos-15=arm64（默认，池子大不排队）；macos-15-intel=x64；macos-latest=macOS 26 arm64（最新镜像，常因容量不足排队甚至被取消）"
        type: choice
        required: false
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
      tag_name:
        description: "可选：填了就发 Release（如 v8.0.0）；留空只上传 Artifact"
        required: false
        default: ""
      ref:
        description: "可选：要构建的分支/标签；留空=当前触发这次运行的分支"
        required: false
        default: ""

jobs:
  build-macos:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 原来写死 ref: master，导致在功能分支上手动触发也只会构建 master。
          # 改成默认跟当前运行的分支走，需要时可显式覆盖。
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Show runner info
        id: meta
        run: |
          echo "runner label: ${{ inputs.runner }}"
          uname -m
          sw_vers
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # macos-15 / macos-15-intel 只有 Xcode 16.4（macOS 15.5 SDK），
        # connectivity_plus 7.1.0+ 的 NWPath.isUltraConstrained 编译不过：
        #   PathMonitorConnectivityProvider.swift:29:42: error: value of type
        #   'NWPath' has no member 'isUltraConstrained'
        # 用 pub 的局部覆盖降到 7.0.0（pubspec.yaml / pubspec.lock 不动）。
        # 与 fqapp 的 macos.yml 同一套做法。
        run: |
          cd simple_live_app
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS (dmg + zip)
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip

      - name: List build output
        if: always()
        run: find simple_live_app/build/dist -type f 2>/dev/null || echo "no dist output"

      - name: Verify architecture
        if: always()
        run: |
          BIN=$(ls -d simple_live_app/build/macos/Build/Products/Release/*.app/Contents/MacOS/* 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "app bundle not found, skip"; exit 0
          fi
          echo "binary: $BIN"
          echo "--- lipo ---"
          lipo -info "$BIN" || true
          echo "--- file ---"
          file "$BIN" || true
          echo "--- min system ---"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep minos || true

      - name: Upload macOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 用 uname -m 区分架构。GitHub 表达式没有 replace()，
          # 早前用 replace(inputs.runner, 'macos-', '') 导致整个 workflow 被判非法。
          name: macos-${{ steps.meta.outputs.arch }}
          if-no-files-found: warn
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      - name: Upload Release
        if: inputs.tag_name != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip
